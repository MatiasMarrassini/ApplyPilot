<tr id="job-{{ job.id }}" class="{{ 'is-discarded' if job.discarded_at }}">
  <td>{% include "jobs/_score.html" %}</td>
  <td><a href="/jobs/{{ job.id }}">{{ job.title or "(sin título)" }}</a></td>
  <td>{{ job.site or "—" }}</td>
  <td>{{ job.location or "—" }}</td>
  <td><span class="status status-{{ job.status_class }}">{{ job.status_label }}</span></td>
  <td class="row-actions">
    {% if job.discarded_at %}
    <button class="secondary outline small" hx-post="/jobs/{{ job.id }}/restore" hx-target="closest tr" hx-swap="outerHTML">Restaurar</button>
    {% else %}
    {% if job.applied_at %}
    <button class="secondary outline small" hx-post="/jobs/{{ job.id }}/unapply" hx-target="closest tr" hx-swap="outerHTML">Desmarcar</button>
    {% else %}
    <button class="outline small" hx-post="/jobs/{{ job.id }}/applied" hx-target="closest tr" hx-swap="outerHTML">Ya apliqué</button>
    {% endif %}
    <button class="secondary outline small" hx-post="/jobs/{{ job.id }}/discard" hx-target="closest tr" hx-swap="outerHTML">Descartar</button>
    {% endif %}
  </td>
</tr>
